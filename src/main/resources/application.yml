spring:
  application:
    name: tracker
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracker}
    username: ${DB_USER:tracker}
    password: ${DB_PASSWORD:tracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

server:
  port: ${PORT:8080}

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  app-token: ${SLACK_APP_TOKEN:}
  socket-mode-enabled: ${SLACK_SOCKET_MODE_ENABLED:false}

papers:
  resolution-enabled: ${PAPER_RESOLUTION_ENABLED:true}

# any OpenAI-style chat endpoint; the default is a local Ollama, so nothing leaves the machine
llm:
  enabled: ${LLM_ENABLED:false}
  base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
  model: ${LLM_MODEL:llama3.2:3b}
  api-key: ${LLM_API_KEY:}
  timeout: ${LLM_TIMEOUT:60s}
