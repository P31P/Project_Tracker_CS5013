<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raman Lab Tracker</title>
    <script>
        // apply the theme picked with the header's theme switch before the page is drawn, so it never flashes
        try {
            const theme = localStorage.getItem('theme');
            if (theme) {
                document.documentElement.dataset.theme = theme;
            }
        } catch {
            // storage is blocked, so the page follows the computer's setting
        }
    </script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="app-header">
        <a class="brand" href="#">
            <span class="logo" aria-hidden="true">RL</span>
            <span class="brand-name">Raman Lab Tracker</span>
        </a>
        <nav id="tabs" class="tabs" aria-label="Sections"></nav>
        <div id="theme-picker" class="theme-picker"></div>
        <details class="user-menu">
            <summary id="avatar" class="avatar" aria-label="Account"></summary>
            <div class="menu">
                <p id="user-name" class="menu-name"></p>
                <p id="user-email" class="menu-email"></p>
                <button id="sign-out" type="button" class="menu-item">Sign out</button>
            </div>
        </details>
    </header>
    <main id="content" class="content"></main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
