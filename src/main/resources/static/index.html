<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raman Lab Tracker</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body>
    <header class="app-header">
        <a class="brand" href="#">
            <span class="logo" aria-hidden="true">RL</span>
            <span class="brand-name">Raman Lab Tracker</span>
        </a>
        <nav id="tabs" class="tabs" aria-label="Sections"></nav>
        <form id="search" class="search" role="search">
            <input id="search-input" class="input search-input" type="search" name="q" placeholder="Search" aria-label="Search projects, ideas and papers" autocomplete="off">
        </form>
        <details class="user-menu">
            <summary id="avatar" class="avatar" aria-label="Account"></summary>
            <div class="menu">
                <p id="user-name" class="menu-name"></p>
                <p id="user-email" class="menu-email"></p>
                <button id="sign-out" type="button" class="menu-item">Sign out</button>
            </div>
        </details>
    </header>
    <main id="content" class="content"></main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
